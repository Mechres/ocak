<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ocak</title>
<style>
  :root {
    --bg:#0b0f17; --panel:#111824; --card:#131a26; --border:#233046; --fg:#e5ecf6; --mut:#8ea0ba;
    --acc:#5eead4; --acc-ink:#042f2e; --user:#1a2a3f; --code:#090d14; --warn:#f59e0b; --err:#ef4444;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#ffffff; --card:#ffffff; --border:#d9dee7; --fg:#18202c; --mut:#5f6b7d;
      --acc:#0f766e; --acc-ink:#ffffff; --user:#e6eef9; --code:#f1f3f6; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:var(--sans); background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
  button { background:var(--card); color:var(--fg); border:1px solid var(--border); padding:6px 11px; border-radius:7px; cursor:pointer; font:inherit; font-size:13px; }
  button:hover:not(:disabled) { border-color:var(--acc); color:var(--acc); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); font-weight:600; }
  button.primary:hover:not(:disabled) { filter:brightness(1.08); color:var(--acc-ink); }
  button.ghost { background:transparent; border-color:transparent; color:var(--mut); padding:3px 6px; font-size:12px; }
  button.ghost:hover:not(:disabled) { color:var(--acc); border-color:transparent; }
  textarea, input, select { background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:7px; padding:7px 9px; font:inherit; font-size:13px; width:100%; }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--acc); }
  label { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; display:block; margin:12px 0 5px; }

  header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel); flex:none; }
  header .logo { font-family:var(--mono); font-weight:700; letter-spacing:.08em; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border-color:transparent; background:transparent; color:var(--mut); }
  .tabs button.on { color:var(--fg); background:var(--card); border-color:var(--border); }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12px; color:var(--mut); }
  header .right input { width:170px; padding:5px 8px; font-size:12px; }
  #gpuLine { font-family:var(--mono); white-space:nowrap; }
  #menuBtn { display:none; }
  #sideKeyWrap { display:none; }

  main { flex:1; min-height:0; display:flex; }
  .view { flex:1; min-height:0; display:none; }
  .view.on { display:flex; }

  /* ---- chat ---- */
  #sidebar { width:270px; flex:none; border-right:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  #sidebar .top { padding:12px; display:flex; gap:8px; }
  #sidebar .top button { flex:1; }
  #chatList { flex:1; overflow-y:auto; padding:0 8px 8px; min-height:60px; }
  .chatItem { display:flex; align-items:center; gap:4px; padding:7px 8px; border-radius:7px; cursor:pointer; font-size:13px; color:var(--mut); }
  .chatItem:hover { background:var(--card); color:var(--fg); }
  .chatItem.on { background:var(--card); color:var(--fg); border:1px solid var(--border); }
  .chatItem .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #settings { border-top:1px solid var(--border); padding:4px 12px 14px; overflow-y:auto; max-height:52%; }
  #settings .row { display:flex; gap:8px; }
  #settings .row > div { flex:1; }
  .check { display:flex; align-items:center; gap:8px; font-size:13px; margin-top:12px; color:var(--fg); text-transform:none; letter-spacing:0; }
  .check input { width:auto; }

  #chatMain { flex:1; min-width:0; display:flex; flex-direction:column; }
  #messages { flex:1; overflow-y:auto; padding:22px 16px 10px; }
  .thread { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .empty { margin:12vh auto 0; text-align:center; color:var(--mut); max-width:460px; line-height:1.6; }
  .empty .big { font-family:var(--mono); font-size:26px; color:var(--fg); letter-spacing:.1em; margin-bottom:8px; }
  .msg { display:flex; flex-direction:column; gap:6px; }
  .msg.user { align-items:flex-end; }
  .bubble { line-height:1.6; font-size:15px; overflow-wrap:anywhere; }
  .msg.user .bubble { background:var(--user); border:1px solid var(--border); padding:9px 14px; border-radius:14px 14px 4px 14px; max-width:85%; white-space:pre-wrap; }
  .msg.assistant .bubble { width:100%; }
  .msg.error .bubble { color:var(--err); }
  .bubble p { margin:0 0 .7em; }
  .bubble > :last-child { margin-bottom:0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin:1em 0 .45em; line-height:1.3; }
  .bubble h1 { font-size:1.3em; } .bubble h2 { font-size:1.18em; } .bubble h3, .bubble h4 { font-size:1.05em; }
  .bubble ul, .bubble ol { margin:0 0 .7em; padding-left:1.4em; }
  .bubble li { margin:.15em 0; }
  .bubble hr { border:0; border-top:1px solid var(--border); margin:1em 0; }
  .bubble blockquote { margin:0 0 .7em; padding-left:12px; border-left:3px solid var(--border); color:var(--mut); }
  .bubble code { font-family:var(--mono); font-size:.88em; background:var(--code); border:1px solid var(--border); padding:1px 5px; border-radius:5px; }
  .bubble a { color:var(--acc); }
  .codeblock { margin:0 0 .8em; border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--code); }
  .codeblock .bar { display:flex; justify-content:space-between; align-items:center; padding:4px 6px 4px 12px; font-size:11px; color:var(--mut); border-bottom:1px solid var(--border); font-family:var(--mono); }
  .codeblock pre { margin:0; padding:12px; overflow-x:auto; }
  .codeblock pre code { background:none; border:0; padding:0; font-size:13px; line-height:1.5; }
  details.think { border:1px solid var(--border); border-radius:9px; background:var(--panel); font-size:13px; }
  details.think summary { cursor:pointer; padding:6px 11px; color:var(--mut); user-select:none; }
  details.think .body { padding:2px 12px 10px; color:var(--mut); white-space:pre-wrap; line-height:1.55; max-height:340px; overflow-y:auto; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; color:var(--mut); font-family:var(--mono); }
  .cursor::after { content:"▍"; color:var(--acc); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  #composer { padding:10px 16px 16px; flex:none; }
  #composer .box { max-width:820px; margin:0 auto; border:1px solid var(--border); border-radius:14px; background:var(--panel); padding:8px; display:flex; gap:8px; align-items:flex-end; }
  #composer .box:focus-within { border-color:var(--acc); }
  #input { border:0; background:transparent; resize:none; max-height:220px; font-size:15px; line-height:1.5; padding:6px 8px; }
  #composer .hint { max-width:820px; margin:6px auto 0; font-size:11px; color:var(--mut); display:flex; justify-content:space-between; gap:8px; }

  /* ---- dashboard ---- */
  #dashView { overflow-y:auto; padding:18px; display:none; flex-direction:column; }
  #dashView.on { display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .card .label { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; }
  .card .val { font-size:19px; font-weight:700; margin:4px 0 8px; font-family:var(--mono); }
  .barline { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; border:1px solid var(--border); }
  .fill { height:100%; background:var(--acc); transition:width .3s; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; font-family:var(--mono); }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--mut); font-weight:600; }
  .pill { display:inline-block; padding:2px 7px; border-radius:99px; font-size:11px; background:var(--bg); color:var(--mut); border:1px solid var(--border); }
  .pill.active_gpu { color:#10b981; border-color:#10b981; }
  .pill.warm_sleep { color:var(--warn); border-color:var(--warn); }

  @media (max-width: 820px) {
    #menuBtn { display:inline-block; }
    #gpuLine { display:none; }
    header .right { display:none; }
    #sideKeyWrap { display:block; }
    #sidebar { position:fixed; top:53px; bottom:0; left:0; z-index:5; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 30px rgba(0,0,0,.4); }
    #sidebar.open { transform:none; }
  }
</style>
</head>
<body>
<header>
  <button id="menuBtn" class="ghost" title="Chats and settings">☰</button>
  <span class="logo">OCAK</span>
  <nav class="tabs">
    <button id="tabChat" class="on">Chat</button>
    <button id="tabDash">Dashboard</button>
  </nav>
  <div class="right">
    <span id="gpuLine"></span>
    <input id="apiKey" type="password" placeholder="API key (optional)"/>
    <button id="saveKeyBtn">Set key</button>
  </div>
</header>
<main>
  <section id="chatView" class="view on">
    <aside id="sidebar">
      <div class="top"><button id="newChatBtn" class="primary">+ New chat</button></div>
      <div id="chatList"></div>
      <div id="settings">
        <label for="selModel">Model</label>
        <select id="selModel"></select>
        <label for="sysPrompt">System prompt</label>
        <textarea id="sysPrompt" rows="3" placeholder="Optional instructions for the assistant"></textarea>
        <div class="row">
          <div><label for="temp">Temperature <span id="tempVal"></span></label><input id="temp" type="range" min="0" max="2" step="0.05"/></div>
          <div><label for="maxTok">Max tokens</label><input id="maxTok" type="number" min="1" max="32768" step="1"/></div>
        </div>
        <label class="check"><input id="think" type="checkbox"/> Thinking (reasoning models)</label>
        <div id="sideKeyWrap">
          <label for="sideKey">API key</label>
          <div class="row"><div><input id="sideKey" type="password" placeholder="optional"/></div><button id="sideKeyBtn">Set</button></div>
        </div>
      </div>
    </aside>
    <div id="chatMain">
      <div id="messages"><div class="thread" id="thread"></div></div>
      <div id="composer">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Message Ocak…"></textarea>
          <button id="sendBtn" class="primary">Send</button>
        </div>
        <div class="hint"><span>Enter to send · Shift+Enter for a new line</span><span id="status"></span></div>
      </div>
    </div>
  </section>
  <section id="dashView" class="view">
    <div class="grid">
      <div class="card"><div class="label">GPU VRAM</div><div class="val" id="vram">--</div><div class="barline"><div class="fill" id="vramBar" style="width:0%"></div></div></div>
      <div class="card"><div class="label">GPU GTT</div><div class="val" id="gtt">--</div><div class="barline"><div class="fill" id="gttBar" style="width:0%"></div></div></div>
      <div class="card"><div class="label">Power / Temp / Busy</div><div class="val" id="pwr">--</div><div class="label" id="hip">--</div></div>
      <div class="card"><div class="label">Inference counters</div><div class="val" id="stats">--</div><div class="label" id="kv">--</div></div>
    </div>
    <div class="card">
      <div class="label" style="margin-bottom:8px">Local model catalog</div>
      <div class="tablewrap"><table><thead><tr><th>Model</th><th>Arch</th><th>Size</th><th>Engine</th><th>State</th><th>Actions</th></tr></thead><tbody id="models"></tbody></table></div>
    </div>
  </section>
</main>
<script>
'use strict';
// Everything model- or user-provided is inserted as text (DOM nodes / textContent), never as HTML.
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const gi = b => (b / (1024 ** 3)).toFixed(2) + ' GiB';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------------- auth ----------------
function apiKey() { try { return localStorage.getItem('ocak_api_key') || ''; } catch { return ''; } }
function authHeaders(extra = {}) { const k = apiKey(); return k ? { ...extra, 'Authorization': 'Bearer ' + k } : extra; }
$('apiKey').value = $('sideKey').value = apiKey();
function saveKey(k) {
  k = k.trim();
  try { if (k) localStorage.setItem('ocak_api_key', k); else localStorage.removeItem('ocak_api_key'); } catch {}
  $('apiKey').value = $('sideKey').value = k;
  connectEvents();
}
$('saveKeyBtn').onclick = () => saveKey($('apiKey').value);
$('sideKeyBtn').onclick = () => saveKey($('sideKey').value);

// ---------------- tabs / layout ----------------
function showTab(chat) {
  $('tabChat').classList.toggle('on', chat); $('tabDash').classList.toggle('on', !chat);
  $('chatView').classList.toggle('on', chat); $('dashView').classList.toggle('on', !chat);
  $('menuBtn').style.visibility = chat ? '' : 'hidden';
}
$('tabChat').onclick = () => showTab(true);
$('tabDash').onclick = () => showTab(false);
$('menuBtn').onclick = () => $('sidebar').classList.toggle('open');

// ---------------- dashboard (live status over SSE) ----------------
let models = [];
function renderStatus(s) {
  if (s.gpu) {
    const vp = s.gpu.vram_total_bytes ? 100 * s.gpu.vram_used_bytes / s.gpu.vram_total_bytes : 0;
    const gp = s.gpu.gtt_total_bytes ? 100 * s.gpu.gtt_used_bytes / s.gpu.gtt_total_bytes : 0;
    $('vram').textContent = gi(s.gpu.vram_used_bytes) + ' / ' + gi(s.gpu.vram_total_bytes);
    $('vramBar').style.width = vp.toFixed(1) + '%';
    $('gtt').textContent = gi(s.gpu.gtt_used_bytes) + ' / ' + gi(s.gpu.gtt_total_bytes);
    $('gttBar').style.width = gp.toFixed(1) + '%';
    $('pwr').textContent = s.gpu.power_watts.toFixed(1) + ' W · ' + s.gpu.temp_celsius.toFixed(0) + '°C · ' + s.gpu.gpu_busy_percent + '%';
    $('gpuLine').textContent = 'VRAM ' + vp.toFixed(0) + '% · ' + s.gpu.power_watts.toFixed(0) + ' W · ' + s.gpu.gpu_busy_percent + '% busy';
  }
  $('hip').textContent = s.hip ? s.hip.detail : '';
  $('stats').textContent = s.tokens_generated_total + ' tok · ' + s.requests_total + ' req';
  $('kv').textContent = 'Radix KV prefix hits: ' + s.kv_radix_hits_total;
  const td = t => el('td', null, t);
  const btn = (label, id, op) => { const b = el('button', null, label); b.onclick = () => modelAction(id, op); return b; };
  $('models').replaceChildren(...(s.models || []).map(m => {
    const tr = el('tr');
    tr.append(td(m.id), td(m.arch), td(gi(m.size_bytes)), td(m.engine));
    const pill = el('span', 'pill ' + String(m.residency).replace(/[^A-Za-z0-9_-]/g, ''), m.residency);
    const c1 = el('td'); c1.append(pill);
    const c2 = el('td'); c2.append(btn('Load', m.id, 'load'), ' ', btn('Sleep', m.id, 'sleep'));
    tr.append(c1, c2);
    return tr;
  }));
  const seen = new Set();
  const chatModels = (s.models || []).filter(m => !m.is_mmproj && !/asr/i.test(m.id) && !seen.has(m.id) && seen.add(m.id));
  const sig = chatModels.map(m => m.id + ':' + m.residency).join('|');
  if (sig !== models.sig) { models = chatModels; models.sig = sig; fillModelSelect(); }
}
async function modelAction(id, op) {
  await fetch('/v1/ocak/models/' + encodeURIComponent(id) + '/' + op, { method: 'POST', headers: authHeaders() });
}
let es = null;
function connectEvents() {
  if (es) es.close();
  const k = apiKey();
  es = new EventSource(k ? '/v1/ocak/events?api_key=' + encodeURIComponent(k) : '/v1/ocak/events');
  es.onmessage = e => { try { renderStatus(JSON.parse(e.data)); } catch {} };
}

// ---------------- settings ----------------
const settings = Object.assign({ model: '', system: '', temperature: 0.7, max_tokens: 1024, thinking: false }, store.get('ocak_chat_settings', {}));
function saveSettings() { store.set('ocak_chat_settings', settings); }
$('sysPrompt').value = settings.system;
$('temp').value = settings.temperature; $('tempVal').textContent = Number(settings.temperature).toFixed(2);
$('maxTok').value = settings.max_tokens;
$('think').checked = settings.thinking;
$('sysPrompt').oninput = () => { settings.system = $('sysPrompt').value; saveSettings(); };
$('temp').oninput = () => { settings.temperature = Number($('temp').value); $('tempVal').textContent = settings.temperature.toFixed(2); saveSettings(); };
$('maxTok').onchange = () => { settings.max_tokens = Math.max(1, Math.min(32768, parseInt($('maxTok').value, 10) || 1024)); $('maxTok').value = settings.max_tokens; saveSettings(); };
$('think').onchange = () => { settings.thinking = $('think').checked; saveSettings(); };
$('selModel').onchange = () => { settings.model = $('selModel').value; saveSettings(); };
function fillModelSelect() {
  const sel = $('selModel');
  const keep = settings.model;
  sel.replaceChildren(...models.map(m => {
    const o = el('option', null, m.id + (m.residency === 'active_gpu' ? '  ●' : ''));
    o.value = m.id; return o;
  }));
  if (models.some(m => m.id === keep)) sel.value = keep;
  else if (models.length) { const a = models.find(m => m.residency === 'active_gpu') || models[0]; sel.value = a.id; settings.model = a.id; saveSettings(); }
}

// ---------------- conversations ----------------
let chats = store.get('ocak_chats', []);
let currentId = store.get('ocak_current_chat', null);
function saveChats() { store.set('ocak_chats', chats.slice(0, 200)); store.set('ocak_current_chat', currentId); }
function current() { return chats.find(c => c.id === currentId) || null; }
function newChat() {
  const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), title: 'New chat', messages: [], updated: Date.now() };
  chats.unshift(c); currentId = c.id; saveChats(); renderList(); renderThread();
  $('sidebar').classList.remove('open'); $('input').focus();
  return c;
}
function renderList() {
  $('chatList').replaceChildren(...chats.map(c => {
    const item = el('div', 'chatItem' + (c.id === currentId ? ' on' : ''));
    item.append(el('span', 't', c.title));
    const del = el('button', 'ghost', '✕'); del.title = 'Delete chat';
    del.onclick = ev => {
      ev.stopPropagation();
      if (busy && c.id === currentId) return;
      chats = chats.filter(x => x.id !== c.id);
      if (currentId === c.id) currentId = chats[0] ? chats[0].id : null;
      saveChats(); renderList(); renderThread();
    };
    item.append(del);
    item.onclick = () => { if (busy) return; currentId = c.id; saveChats(); renderList(); renderThread(); $('sidebar').classList.remove('open'); };
    return item;
  }));
}
$('newChatBtn').onclick = () => { if (!busy) newChat(); };

// ---------------- markdown (safe: builds DOM nodes, no HTML parsing) ----------------
function inline(text, parent) {
  const re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(\*[^*\s\n][^*\n]*\*)|(\[[^\]\n]+\]\((https?:\/\/[^)\s]+)\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(text.slice(last, m.index));
    if (m[1]) parent.append(el('code', null, m[1].slice(1, -1)));
    else if (m[2]) parent.append(el('strong', null, m[2].slice(2, -2)));
    else if (m[3]) parent.append(el('em', null, m[3].slice(1, -1)));
    else if (m[4]) {
      const a = el('a', null, m[4].slice(1, m[4].indexOf('](')));
      a.href = m[5]; a.target = '_blank'; a.rel = 'noopener noreferrer';
      parent.append(a);
    }
    last = re.lastIndex;
  }
  if (last < text.length) parent.append(text.slice(last));
}
function codeBlock(lang, code) {
  const box = el('div', 'codeblock');
  const bar = el('div', 'bar');
  bar.append(el('span', null, lang || 'code'));
  const cp = el('button', 'ghost', 'Copy');
  cp.onclick = () => copyText(code, cp);
  bar.append(cp);
  const pre = el('pre'); pre.append(el('code', null, code));
  box.append(bar, pre);
  return box;
}
function blocks(text, out) {
  const lines = text.split('\n');
  let para = [];
  let stack = [];        // open lists: { el, indent }
  let gap = false;       // blank line seen since the last list line
  const flushPara = () => { if (para.length) { const p = el('p'); para.forEach((l, i) => { if (i) p.append(el('br')); inline(l, p); }); out.append(p); para = []; } };
  const closeLists = () => { if (stack.length) out.append(stack[0].el); stack = []; gap = false; };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    let m;
    if (!line.trim()) { flushPara(); if (stack.length) gap = true; continue; }
    if ((m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
      flushPara();
      const indent = m[1].replace(/\t/g, '    ').length;
      const ordered = /\d/.test(m[2]);
      while (stack.length > 1 && indent < stack[stack.length - 1].indent) stack.pop();
      let top = stack[stack.length - 1];
      if (top && indent > top.indent + 1 && top.el.lastChild) {
        const sub = el(ordered ? 'ol' : 'ul');
        if (ordered) sub.start = parseInt(m[2], 10) || 1;
        top.el.lastChild.append(sub);
        stack.push(top = { el: sub, indent });
      } else if (!top || (top.el.tagName === 'OL') !== ordered) {
        if (stack.length <= 1) {
          closeLists();
          const l = el(ordered ? 'ol' : 'ul');
          if (ordered) l.start = parseInt(m[2], 10) || 1;
          stack = [top = { el: l, indent }];
        }
      }
      const li = el('li'); inline(m[3], li); top.el.append(li);
      gap = false;
      continue;
    }
    // Indented text right after a list item continues it; anything else ends the lists.
    if (stack.length && (!gap || /^\s{2,}/.test(raw))) {
      const li = stack[stack.length - 1].el.lastChild;
      if (li) { li.append(gap ? el('br') : ' '); inline(line.trim(), li); gap = false; continue; }
    }
    closeLists();
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushPara(); const h = el('h' + m[1].length); inline(m[2], h); out.append(h); continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); const q = el('blockquote'); inline(m[1], q); out.append(q); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flushPara(); out.append(el('hr')); continue; }
    para.push(line);
  }
  flushPara(); closeLists();
}
function renderMarkdown(text, out) {
  out.replaceChildren();
  const re = /```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(```|$)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) blocks(text.slice(last, m.index), out);
    out.append(codeBlock(m[1], m[2].replace(/\n$/, '')));
    last = re.lastIndex;
    if (m[0].length === 0) break;
  }
  if (last < text.length) blocks(text.slice(last), out);
}
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); } catch {
    const ta = el('textarea'); ta.value = t; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch {} ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = o, 1200); }
}

// ---------------- thread rendering ----------------
function statsText(m) {
  const t = m.timings;
  if (!t) return '';
  const parts = [];
  if (t.prompt_n != null) parts.push(t.prompt_n + ' prompt tok' + (t.cache_n ? ' (' + t.cache_n + ' cached)' : '') + (t.prompt_per_second ? ' @ ' + t.prompt_per_second.toFixed(0) + '/s' : ''));
  if (t.predicted_n != null) parts.push(t.predicted_n + ' tok @ ' + (t.predicted_per_second || 0).toFixed(1) + '/s');
  if (t.mtp_drafted) parts.push('MTP ' + t.mtp_accepted + '/' + t.mtp_drafted);
  return parts.join(' · ');
}
function messageView(m, idx, isLast) {
  const wrap = el('div', 'msg ' + (m.error ? 'assistant error' : m.role));
  if (m.role === 'user') {
    wrap.append(el('div', 'bubble', m.content));
    return wrap;
  }
  if (m.reasoning && m.reasoning.trim()) {
    const d = el('details', 'think');
    d.open = !!m.thinkingOpen;
    d.ontoggle = () => { m.thinkingOpen = d.open; };
    d.append(el('summary', null, m.streaming && !m.content ? 'Thinking…' : 'Thoughts'), el('div', 'body', m.reasoning.trim()));
    wrap.append(d);
  }
  const bubble = el('div', 'bubble');
  if (m.error) bubble.textContent = m.content;
  else renderMarkdown(m.content || '', bubble);
  if (m.streaming) bubble.classList.add('cursor');
  wrap.append(bubble);
  if (!m.streaming) {
    const meta = el('div', 'meta');
    const cp = el('button', 'ghost', 'Copy'); cp.onclick = () => copyText(m.content || '', cp);
    meta.append(cp);
    if (isLast) { const rg = el('button', 'ghost', 'Regenerate'); rg.onclick = () => regenerate(); meta.append(rg); }
    const st = statsText(m);
    if (m.model) meta.append(el('span', null, m.model));
    if (st) meta.append(el('span', null, '· ' + st));
    if (m.finish === 'length') meta.append(el('span', null, '· stopped at max tokens'));
    if (m.finish === 'cancelled') meta.append(el('span', null, '· stopped'));
    wrap.append(meta);
  }
  return wrap;
}
function renderThread() {
  const c = current();
  const th = $('thread');
  if (!c || !c.messages.length) {
    const e = el('div', 'empty');
    e.append(el('div', 'big', 'OCAK'), el('div', null, 'Pick a model in the sidebar and start typing. Conversations are kept in this browser.'));
    th.replaceChildren(e);
    return;
  }
  th.replaceChildren(...c.messages.map((m, i) => messageView(m, i, i === c.messages.length - 1)));
}
function nearBottom() { const s = $('messages'); return s.scrollHeight - s.scrollTop - s.clientHeight < 120; }
function scrollBottom() { const s = $('messages'); s.scrollTop = s.scrollHeight; }

// ---------------- sending ----------------
let busy = false, abortCtl = null, renderQueued = false;
function setBusy(b) {
  busy = b;
  $('sendBtn').textContent = b ? 'Stop' : 'Send';
  $('sendBtn').classList.toggle('primary', !b);
  $('newChatBtn').disabled = b;
}
function queueRender(stick) {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderThread(); if (stick) scrollBottom(); });
}
async function send(text) {
  let c = current() || newChat();
  if (!settings.model) { $('status').textContent = 'No model selected'; return; }
  if (text != null) {
    c.messages.push({ role: 'user', content: text });
    if (c.title === 'New chat') c.title = text.replace(/\s+/g, ' ').slice(0, 60);
  }
  const history = c.messages.filter(m => !m.error).map(m => ({ role: m.role, content: m.content || '' }));
  if (settings.system.trim()) history.unshift({ role: 'system', content: settings.system.trim() });
  const reply = { role: 'assistant', content: '', reasoning: '', streaming: true, thinkingOpen: true, model: settings.model };
  c.messages.push(reply);
  c.updated = Date.now();
  chats = [c, ...chats.filter(x => x.id !== c.id)];
  saveChats(); renderList(); renderThread(); scrollBottom();
  setBusy(true);
  $('status').textContent = 'Waiting for ' + settings.model + '…';
  abortCtl = new AbortController();
  const body = {
    model: settings.model, stream: true, messages: history,
    temperature: settings.temperature, max_tokens: settings.max_tokens,
    stream_options: { include_usage: true },
    chat_template_kwargs: { enable_thinking: settings.thinking },
  };
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body), signal: abortCtl.signal,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (await res.text()).slice(0, 500));
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    const t0 = performance.now(); let first = true;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        if (j.error) throw new Error(j.error.message || 'generation failed');
        const ch = j.choices && j.choices[0];
        if (ch && ch.delta) {
          if (ch.delta.reasoning_content) reply.reasoning += ch.delta.reasoning_content;
          if (ch.delta.content) {
            if (!reply.content) reply.thinkingOpen = false;
            reply.content += ch.delta.content;
          }
          if (first && (ch.delta.content || ch.delta.reasoning_content)) { first = false; $('status').textContent = 'Generating… (first token ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s)'; }
        }
        if (ch && ch.finish_reason) reply.finish = ch.finish_reason;
        if (j.timings) reply.timings = j.timings;
        queueRender(nearBottom());
      }
    }
    $('status').textContent = '';
  } catch (e) {
    if (e.name === 'AbortError') { reply.finish = 'cancelled'; $('status').textContent = ''; }
    else {
      if (!reply.content) { reply.error = true; reply.content = String(e.message || e); }
      else reply.finish = 'error';
      $('status').textContent = 'Error';
    }
  } finally {
    reply.streaming = false;
    if (!(reply.reasoning || '').trim()) delete reply.reasoning;
    abortCtl = null;
    setBusy(false);
    c.updated = Date.now();
    saveChats(); renderThread();
    if (nearBottom()) scrollBottom();
  }
}
function regenerate() {
  const c = current();
  if (busy || !c) return;
  while (c.messages.length && c.messages[c.messages.length - 1].role !== 'user') c.messages.pop();
  if (!c.messages.length) return;
  send(null);
}
function submit() {
  if (busy) { if (abortCtl) abortCtl.abort(); return; }
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = ''; autosize();
  send(text);
}
function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 220) + 'px'; }
$('input').addEventListener('input', autosize);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});
$('sendBtn').onclick = submit;

// A reply interrupted by a page reload is no longer streaming.
for (const c of chats) for (const m of c.messages) if (m.streaming) { m.streaming = false; m.finish = m.finish || 'cancelled'; }
if (!current() && chats.length) currentId = chats[0].id;
renderList(); renderThread(); scrollBottom();
connectEvents();
$('input').focus();
</script>
</body>
</html>
