name: GPU

# Runs on the self-hosted RX 6700 XT runner (label `ocak-gpu`), which has the Vulkan driver
# and the test models (OCAK_MODELS_DIR is set in the runner's .env). Only pushes to master and
# manual runs trigger it: fork pull requests must never reach the self-hosted machine (the repo
# also requires approval for all external contributors' workflow runs).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: gpu-runner
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gpu:
    if: github.repository == 'Mechres/ocak'
    runs-on: [self-hosted, ocak-gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Tests (GPU kernels included)
        run: cargo test --release --workspace

      - name: Long-context counting test
        run: cargo run --release --bin ocak -- count-test

      - name: Long-context counting test (HIP)
        run: cargo run --release --bin ocak -- count-test --backend hip

      - name: Benchmark
        run: |
          set -o pipefail   # a crashed `ocak bench` must fail the step, not vanish behind tee
          bench() { cargo run --release --bin ocak -- bench --prompt-tokens 512 --decode-tokens 64; }
          bench | tee bench.md
          runs="bench.md"
          if ! python3 ci/bench_check.py ci/bench-baseline.md bench.md > /dev/null; then
            # Possible transient contention (someone else using the GPU): one repeat run, and
            # each model is judged by its better result.
            echo "regression or error detected; repeating the benchmark once"
            bench | tee bench2.md
            runs="bench.md bench2.md"
          fi
          {
            echo "## Benchmark (prompt 512, decode 64)"
            cat bench.md
            echo
            echo "## vs. baseline (ci/bench-baseline.md), best of: $runs"
            python3 ci/bench_check.py ci/bench-baseline.md $runs
          } > report.md || true
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          python3 ci/bench_check.py ci/bench-baseline.md $runs

      - name: Benchmark (HIP)
        run: |
          set -o pipefail
          bench() { cargo run --release --bin ocak -- bench --prompt-tokens 512 --decode-tokens 64 --backend hip; }
          bench | tee bench-hip.md
          runs="bench-hip.md"
          if ! python3 ci/bench_check.py ci/bench-baseline-hip.md bench-hip.md > /dev/null; then
            echo "regression or error detected; repeating the HIP benchmark once"
            bench | tee bench-hip2.md
            runs="bench-hip.md bench-hip2.md"
          fi
          {
            echo "## HIP benchmark (prompt 512, decode 64)"
            cat bench-hip.md
            echo
            echo "## vs. baseline (ci/bench-baseline-hip.md), best of: $runs"
            python3 ci/bench_check.py ci/bench-baseline-hip.md $runs
          } > report-hip.md || true
          cat report-hip.md >> "$GITHUB_STEP_SUMMARY"
          python3 ci/bench_check.py ci/bench-baseline-hip.md $runs

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench
          path: |
            bench*.md
            report*.md
          if-no-files-found: ignore
