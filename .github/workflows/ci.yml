name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Vulkan headers & glslc shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev

      - name: Install Rust toolchain
        # Pinned to the toolchain used for local development: floating `stable` pulls in
        # new clippy lints (e.g. 1.100's chunks_exact_to_as_chunks) that fail -D warnings.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -A clippy::too_many_arguments -A clippy::needless_range_loop -A clippy::type_complexity -D warnings

      - name: Unit tests (CPU / non-GPU crates)
        # ocak-vk needs a GPU; ocak-server's end-to-end tests need models (both run on the GPU
        # runner after every push), but its pure unit tests run here.
        run: |
          cargo test --workspace --exclude ocak-vk --exclude ocak-server
          cargo test -p ocak-server --lib loopback
